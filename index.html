<html lang="en" class="h-full">

  <style>
    * { font-family: 'Outfit', sans-serif; }
    
    .gradient-bg {
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .movie-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .movie-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(229, 62, 62, 0.3);
    }
    
    .movie-card:hover .play-overlay {
      opacity: 1;
    }
    
    .movie-card:hover .movie-poster {
      filter: brightness(0.7);
    }
    
    .glow-text {
      text-shadow: 0 0 40px rgba(229, 62, 62, 0.5);
    }
    
    .search-glow:focus {
      box-shadow: 0 0 30px rgba(229, 62, 62, 0.4);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fade-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    
    .animate-delay-1 { animation-delay: 0.1s; opacity: 0; }
    .animate-delay-2 { animation-delay: 0.2s; opacity: 0; }
    .animate-delay-3 { animation-delay: 0.3s; opacity: 0; }
    .animate-delay-4 { animation-delay: 0.4s; opacity: 0; }
    
    .category-pill {
      transition: all 0.3s ease;
    }
    
    .category-pill:hover, .category-pill.active {
      background: #e53e3e;
      color: white;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #e53e3e;
      border-radius: 4px;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
 </head>
 <body class="h-full gradient-bg text-white overflow-auto">
  <div class="min-h-full w-full">
   <!-- Navigation -->
   <nav class="fixed top-0 left-0 right-0 z-50 glass-card">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3">
     <svg class="w-7 h-7 text-red-500" fill="currentColor" viewbox="0 0 24 24"><path d="M4 6h16v10H4zm0 12h16v2H4z" /> <rect x="7" y="3" width="2" height="3" fill="currentColor" /> <rect x="15" y="3" width="2" height="3" fill="currentColor" />
     </svg><span id="nav-title" class="text-xl font-bold">MovieStream</span>
    </div>
   </nav><!-- Hero Section -->
   <section class="pt-32 pb-16 px-6">
    <div class="max-w-7xl mx-auto text-center">
     <h1 id="hero-title" class="text-5xl md:text-7xl font-bold mb-6 glow-text animate-fade-in">Your Movie Collection</h1>
     <p id="hero-subtitle" class="text-xl text-white/60 mb-12 max-w-2xl mx-auto animate-fade-in animate-delay-1">Stream your favorite movies from your personal library. Anytime, anywhere.</p><!-- Search Bar -->
     <div class="max-w-2xl mx-auto relative animate-fade-in animate-delay-2">
      <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
       </svg>
      </div><input type="text" id="search-input" placeholder="Search for movies..." class="w-full py-4 pl-14 pr-6 bg-white/10 border border-white/20 rounded-2xl text-white placeholder-white/40 focus:outline-none search-glow transition-all" oninput="filterMovies(this.value)">
     </div>
    </div>
   </section><!-- Category Pills -->
   <section class="px-6 pb-8">
    <div class="max-w-7xl mx-auto">
     <div class="flex flex-wrap gap-3 justify-center animate-fade-in animate-delay-3">

     </div>
    </div>

   <section class="px-6 pb-20">

      <!-- Movies will be rendered here -->

     <div id="no-results" class="hidden text-center py-20">

  </div><!-- Video Player Modal -->
  <div id="video-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
   <div class="w-full max-w-4xl bg-black rounded-2xl overflow-hidden glass-card"><!-- Close Button -->
    <div class="flex items-center justify-between p-4 border-b border-white/10">
     <h2 id="modal-title" class="text-xl font-bold text-white">Movie Title</h2><button onclick="closeVideoModal()" class="p-2 hover:bg-white/10 rounded-lg transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg></button>
    </div><!-- Video Player -->
    <div class="aspect-video bg-black">
     <video id="video-player" class="w-full h-full" controls><source id="video-source" src="" type="video/mp4"> Your browser does not support the video tag.
     </video>
    </div><!-- Movie Info -->
    <div class="p-6 space-y-4">
     <div class="flex items-center gap-4 text-sm text-white/60"><span id="modal-year">2024</span> <span id="modal-duration">2h 0m</span>
      <div class="flex items-center gap-1">
       <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
       </svg><span id="modal-rating">8.0</span>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    // =============================================
    // MOVIE DATA - EDIT THIS SECTION TO ADD YOUR MOVIES
    // =============================================
    // HOW TO ADD YOUR GOOGLE DRIVE VIDEOS:
    // 1. Go to Google Drive and find your video file
    // 2. Right-click → Share
    // 3. Change permissions to "Anyone with the link can view"
    // 4. Click the share link, it will look like: https://drive.google.com/file/d/FILE_ID/view
    // 5. Copy the FILE_ID (the long string between /d/ and /view)
    // 6. In the "videoUrl" field, paste this format: https://drive.google.com/uc?export=download&id=FILE_ID
    // 
    // Example: If your link is https://drive.google.com/file/d/1abc123xyz456/view
    // Use: https://drive.google.com/uc?export=download&id=1abc123xyz456
    // 
    // Each movie object needs:
    // - id: unique number
    // - title: movie name
    // - year: release year
    // - category: one of (action, comedy, drama, horror, scifi, romance)
    // - rating: 0-10 rating
    // - posterGradient: gradient colors or replace with image URL
    // - duration: video length
    // - videoUrl: YOUR GOOGLE DRIVE LINK (see instructions above)
    
    const movies = [
      {
        id: 1,
        title: "Baghi 4",
        year: 2026,
        category: "action",
        rating: 8.8,
        posterImage: "https://images.unsplash.com/photo-1519999482648-a6fb3b5bada0?w=500&h=750&fit=crop",

      },
      {

        year: 2014,
        category: "scifi",
        rating: 8.6,
        posterImage: "https://images.unsplash.com/photo-1533613220915-609f21a97b21?w=500&h=750&fit=crop",
        duration: "2h 49m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 4,
        title: "The Notebook",
        year: 2004,
        category: "romance",
        rating: 7.8,
        posterImage: "https://images.unsplash.com/photo-1532694215571-8b90d74b90a1?w=500&h=750&fit=crop",
        duration: "2h 3m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 5,
        title: "Get Out",
        year: 2017,
        category: "horror",
        rating: 7.7,
        posterImage: "https://images.unsplash.com/photo-1478720568477-152d9e3fb523?w=500&h=750&fit=crop",
        duration: "1h 44m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 6,
        title: "The Hangover",
        year: 2009,
        category: "comedy",
        rating: 7.7,
        posterImage: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=500&h=750&fit=crop",
        duration: "1h 40m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 7,
        title: "Forrest Gump",
        year: 1994,
        category: "drama",
        rating: 8.8,
        posterImage: "https://images.unsplash.com/photo-1495535083736-bae3e1b12ed0?w=500&h=750&fit=crop",
        duration: "2h 22m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 8,
        title: "Mad Max: Fury Road",
        year: 2015,
        category: "action",

        posterImage: "https://images.unsplash.com/photo-1489599849228-ed4dc59b1900?w=500&h=750&fit=crop",
        duration: "2h",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 9,
        title: "The Conjuring",
        year: 2013,
        category: "horror",
        rating: 7.5,
        posterImage: "https://images.unsplash.com/photo-1514306688772-aadab7c3c7b9?w=500&h=750&fit=crop",
        duration: "1h 52m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      },
      {
        id: 10,
        title: "La La Land",
        year: 2016,
        category: "romance",
        rating: 8.0,
        posterImage: "https://images.unsplash.com/photo-1533631032020-b34b1af33aef?w=500&h=750&fit=crop",
        duration: "2h 8m",
        videoUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID_HERE"
      }
    ];
    
    // =============================================
    // END OF MOVIE DATA
    // =============================================
    
    let currentCategory = 'all';
    let currentSearch = '';
    
    // Default configuration
    const defaultConfig = {
      site_title: "MovieStream",
      hero_title: "Your Movie Collection",
      hero_subtitle: "Stream your favorite movies from your personal library. Anytime, anywhere.",
      search_placeholder: "Search for movies...",
      primary_color: "#e53e3e",
      background_color: "#0f0f0f",
      text_color: "#ffffff",
      card_color: "#1a1a2e",
      accent_color: "#ec4899"
    };
    
    // Render a single movie card
    function createMovieCard(movie) {
      return `
        <div class="movie-card rounded-xl overflow-hidden glass-card cursor-pointer" data-category="${movie.category}" data-title="${movie.title.toLowerCase()}" onclick="playMovie(${movie.id})">
          <div class="relative aspect-[2/3] movie-poster bg-gray-800 overflow-hidden">
            <img src="${movie.posterImage}" alt="${movie.title}" class="w-full h-full object-cover" loading="lazy" onerror="console.error('Image failed to load:', this.src); this.style.background='#1f2937'; this.alt='Image unavailable';">
            <div class="play-overlay absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 transition-opacity">
              <div class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center transform hover:scale-110 transition">
                <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
            </div>
            <div class="absolute top-3 right-3 bg-black/60 px-2 py-1 rounded-md text-xs font-medium flex items-center gap-1">
              <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
              ${movie.rating}
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-white truncate">${movie.title}</h3>
            <div class="flex items-center justify-between mt-2 text-sm text-white/50">
              <span>${movie.year}</span>
              <span>${movie.duration}</span>
            </div>
          </div>
        </div>
      `;
    }
    
    // Play video function
    function playMovie(movieId) {
      const movie = movies.find(m => m.id === movieId);
      if (!movie) return;
      
      document.getElementById('modal-title').textContent = movie.title;
      document.getElementById('modal-year').textContent = movie.year;
      document.getElementById('modal-duration').textContent = movie.duration;
      document.getElementById('modal-rating').textContent = movie.rating;
      
      // Convert Google Drive URL to iframe embed format
      let videoUrl = movie.videoUrl;
      if (videoUrl.includes('drive.google.com')) {
        // Extract file ID
        const fileIdMatch = videoUrl.match(/id=([a-zA-Z0-9-_]+)/) || videoUrl.match(/\/d\/([a-zA-Z0-9-_]+)\//);
        if (fileIdMatch) {
          const fileId = fileIdMatch[1];
          videoUrl = `https://drive.google.com/file/d/${fileId}/preview`;
        }
      }
      
      // Create iframe for embedded playback
      const videoContainer = document.querySelector('#video-player').parentElement;
      videoContainer.innerHTML = `<iframe src="${videoUrl}" style="width:100%; height:100%; border:none;" allow="autoplay" allowfullscreen></iframe>`;
      
      // Show modal
      document.getElementById('video-modal').classList.remove('hidden');
    }
    
    // Close video modal
    function closeVideoModal() {
      // Clear iframe
      const videoContainer = document.querySelector('.aspect-video');
      if (videoContainer) {
        videoContainer.innerHTML = '';
      }
      document.getElementById('video-modal').classList.add('hidden');
    }
    
    // Close modal when clicking outside video
    document.getElementById('video-modal')?.addEventListener('click', function(e) {
      if (e.target === this) {
        closeVideoModal();
      }
    });
    
    // Render all movies
    function renderMovies(moviesToRender) {
      const grid = document.getElementById('movies-grid');
      const noResults = document.getElementById('no-results');
      
      if (moviesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
        grid.innerHTML = moviesToRender.map(createMovieCard).join('');
      }
    }
    
    // Filter movies by search and category
    function getFilteredMovies() {
      return movies.filter(movie => {
        const matchesCategory = currentCategory === 'all' || movie.category === currentCategory;
        const matchesSearch = movie.title.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesCategory && matchesSearch;
      });
    }
    
    // Search filter function
    function filterMovies(searchTerm) {
      currentSearch = searchTerm;
      renderMovies(getFilteredMovies());
    }
    
    // Category filter function
    function filterByCategory(category, button) {
      currentCategory = category;
      
      // Update active state
      document.querySelectorAll('.category-pill').forEach(pill => {
        pill.classList.remove('active');
      });
      button.classList.add('active');
      
      renderMovies(getFilteredMovies());
    }
    
    // Config change handler
    async function onConfigChange(config) {
      document.getElementById('nav-title').textContent = config.site_title || defaultConfig.site_title;
      document.getElementById('hero-title').textContent = config.hero_title || defaultConfig.hero_title;
      document.getElementById('hero-subtitle').textContent = config.hero_subtitle || defaultConfig.hero_subtitle;
      document.getElementById('search-input').placeholder = config.search_placeholder || defaultConfig.search_placeholder;
    }
    
    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => window.elementSdk.setConfig({ background_color: value })
            },
            {
              get: () => config.card_color || defaultConfig.card_color,
              set: (value) => window.elementSdk.setConfig({ card_color: value })
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => window.elementSdk.setConfig({ text_color: value })
            },
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => window.elementSdk.setConfig({ primary_color: value })
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => window.elementSdk.setConfig({ accent_color: value })
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || 'Outfit',
            set: (value) => window.elementSdk.setConfig({ font_family: value })
          },
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["site_title", config.site_title || defaultConfig.site_title],
          ["hero_title", config.hero_title || defaultConfig.hero_title],
          ["hero_subtitle", config.hero_subtitle || defaultConfig.hero_subtitle],
          ["search_placeholder", config.search_placeholder || defaultConfig.search_placeholder]
        ])
      });
    }
    
    // Initial render
    renderMovies(movies);
  </script>
